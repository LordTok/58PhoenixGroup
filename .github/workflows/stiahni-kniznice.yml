# 58. Phoenix Group — jednorazová akcia (opravný balík v0.77)
# Stiahne knižnice (Supabase, React, d3…) z npm priamo do assets/vendor,
# overí ich kontrolné súčty a zmaže nepoužívané súbory. Spúšťa sa ručne:
# GitHub → záložka Actions → "Stiahni knižnice" → Run workflow.
name: Stiahni knižnice

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Stiahni balíky z npm
        run: |
          set -euo pipefail
          mkdir -p /tmp/v && cd /tmp/v
          for p in @supabase/supabase-js@2 react@18.3.1 react-dom@18.3.1 @babel/standalone@7.29.0 d3@7.9.0 topojson-client@3.1.0 world-atlas@2.0.2; do
            npm pack "$p" --silent
          done
          for t in *.tgz; do mkdir -p "x/${t%.tgz}"; tar -xzf "$t" -C "x/${t%.tgz}"; done
          ls x

      - name: Skopíruj do assets/vendor
        run: |
          set -euo pipefail
          V=assets/vendor; mkdir -p "$V"
          najdi() { f=$(find /tmp/v/x -path "$1" | head -1); test -n "$f" || { echo "Nenašiel som: $1"; find /tmp/v/x -maxdepth 2; exit 1; }; cp "$f" "$2"; echo "OK $2"; }
          najdi "*supabase-supabase-js-*/package/dist/umd/supabase.js" "$V/supabase.js"
          najdi "*react-18.3.1/package/umd/react.production.min.js"         "$V/react.production.min.js"
          najdi "*react-dom-18.3.1/package/umd/react-dom.production.min.js" "$V/react-dom.production.min.js"
          najdi "*babel-standalone-7.29.0/package/babel.min.js"             "$V/babel.min.js"
          najdi "*d3-7.9.0/package/dist/d3.min.js"                           "$V/d3.min.js"
          najdi "*topojson-client-3.1.0/package/dist/topojson-client.min.js" "$V/topojson-client.min.js"
          najdi "*world-atlas-2.0.2/package/countries-50m.json"              "$V/countries-50m.json"
          SUPA=$(find /tmp/v/x -path "*supabase-supabase-js-*/package/dist/umd/supabase.js" | head -1)
          SUPA_VER=$(node -p "require('$(dirname "$(dirname "$(dirname "$SUPA")")")/package.json').version")
          {
            echo "Lokálne knižnice webu 58. Phoenix Group (stiahnuté $(date -u +%F))"
            echo "@supabase/supabase-js $SUPA_VER"
            echo "react 18.3.1, react-dom 18.3.1, @babel/standalone 7.29.0"
            echo "d3 7.9.0, topojson-client 3.1.0, world-atlas 2.0.2"
          } > "$V/VERZIE.txt"
          cat "$V/VERZIE.txt"

      - name: Over kontrolné súčty (SRI zo support.js)
        run: |
          set -euo pipefail
          over() { h="sha384-$(openssl dgst -sha384 -binary "$1" | openssl base64 -A)"; [ "$h" = "$2" ] || { echo "ZLÝ HASH $1: $h"; exit 1; }; echo "OK $1"; }
          over assets/vendor/react.production.min.js     "sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z"
          over assets/vendor/react-dom.production.min.js "sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1"
          over assets/vendor/babel.min.js                "sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"

      - name: Uprac nepoužívané súbory
        run: |
          git rm -r --ignore-unmatch -q _ds assets/vetark-loop.mp4 assets/ambulance.jpg assets/marcus.jpg

      - name: Ulož do repozitára
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/vendor
          git commit -m "Lokálne knižnice v assets/vendor + upratanie nepoužívaných súborov" || echo "Nič nové na uloženie"
          git push
